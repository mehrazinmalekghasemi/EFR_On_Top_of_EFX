name: EFX ownership and exchange experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 1729]
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Exact correctness and regression tests
        run: python -m unittest -v tests.test_engine tests.test_ci tests.test_improvements tests.test_exchange
      - name: Examine ownership changes and repeated exchanges
        env:
          EXPERIMENT_SEED: ${{ matrix.seed }}
        run: python -m efr.exchange_experiment --seed "$EXPERIMENT_SEED" --profiles 40 --seconds 180 --out results/exchange.json
      - name: Save matrices, witnesses, and closed-component certificates
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exchange-${{ matrix.seed }}
          path: results/
          retention-days: 14
          if-no-files-found: warn
